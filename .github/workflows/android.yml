name: Android

# Green with google-services.json.example. Do not add a Firebase, MongoDB, or JWT secret.

on:
  push:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools"
      - name: Use the placeholder Firebase file
        run: cp android/app/google-services.json.example android/app/google-services.json
      - name: Unit tests
        working-directory: android
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest --no-daemon
