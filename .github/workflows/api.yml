name: API

# Green with the committed empty MongoDB connection string and JWT signing key.
# Do not add a Firebase, MongoDB, or JWT secret to this job.

on:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: dotnet test api/MuniPulse.slnx --nologo
